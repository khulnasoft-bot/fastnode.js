# yaml-language-server: $schema=https://unpkg.com/undocs/schema/config.json
name: Fastnode
shortDescription: builds full-stack servers that deploy anywhere
description: Add server API routes to any Vite apps and deploy with zero configuration on your favorite hosting platform.
github: khulnasoft/fastnode
url: https://fastnode.khulnasoft.com
themeColor: "pink"
automd: true
branch: main
versions:
  - label: "v3"
    active: true
  - label: "v2"
    to: "https://v2.fastnode.khulnasoft.com"
socials:
  x: "https://x.com/khulnasoftdev"
  bluesky: "https://bsky.app/profile/fastnode.khulnasoft.com"
  discord: https://discord.fastnode.khulnasoft.com
sponsors:
  api: https://sponsors.pi0.io/sponsors.json
redirects:
  # v2 guide → v3 docs
  "/guide": "/docs"
  "/guide/getting-started": "/docs"
  "/guide/utils": "/docs/routing"
  "/guide/routing": "/docs/routing"
  "/guide/websocket": "/docs/websocket"
  "/guide/cache": "/docs/cache"
  "/guide/storage": "/docs/storage"
  "/guide/database": "/docs/database"
  "/guide/fetch": "/docs/routing"
  "/guide/assets": "/docs/assets"
  "/guide/plugins": "/docs/plugins"
  "/guide/configuration": "/docs/configuration"
  "/guide/typescript": "/docs/configuration"
  "/guide/tasks": "/docs/tasks"
  "/guide/nightly": "/docs/nightly"
  "/guide/nightly-channel": "/docs/nightly"
  "/guide/migration": "/docs/migration"
  "/guide/community/contributing": "/docs"
  # v2 deploy
  "/deploy/workers": "/deploy"
  "/deploy/runtimes/winterjs": "/deploy"
  "/deploy/custom-presets": "/deploy"
  "/deploy/providers/deno-deploy": "/deploy/runtimes/deno#deno-deploy"
  "/deploy/providers/edgio": "/deploy"
  "/deploy/providers/lagon": "/deploy"
  "/deploy/providers/layer0": "/deploy"
  "/deploy/providers/edgeone-pages": "/deploy/providers/edgeone"
  "/deploy/providers/platform-sh": "/deploy/providers/upsun"
  "/deploy/node": "/deploy/runtimes/node"
